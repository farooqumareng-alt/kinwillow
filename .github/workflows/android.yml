name: Android app

# Builds the Play Store package (.aab) for the KinWillow Android app from
# android/twa-manifest.json. See android/README.md.
#
# Run it by hand (Actions → Android app → Run workflow). It also runs when the
# Android configuration or this file changes on main, as a check that the
# build still works.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the JDK and Android SDK
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "::error::ANDROID_HOME is not set on this runner"; exit 1; }
          # Bubblewrap looks for the command-line tools under <sdk>/tools.
          if [ ! -e "$ANDROID_HOME/tools" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            sudo ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Accept Android SDK licences
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          echo "licences accepted"

      - name: Check the toolchain
        continue-on-error: true
        run: bubblewrap doctor

      - name: Set the version code and decide whether to sign
        id: prep
        working-directory: android
        run: |
          set -euo pipefail
          # Every run gets a higher version code, so any build can be uploaded.
          jq --argjson code "${{ github.run_number }}" '.appVersionCode = $code' twa-manifest.json > twa-manifest.tmp
          mv twa-manifest.tmp twa-manifest.json
          echo "Version: $(jq -r .appVersion twa-manifest.json) (code $(jq -r .appVersionCode twa-manifest.json))"
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > upload.p12
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing key found: this build will be signed."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets set — building UNSIGNED. Play Console will not accept this build."
          fi

      - name: Generate the Android project
        working-directory: android
        run: yes "" | bubblewrap update --skipVersionUpgrade

      - name: Build (signed)
        if: steps.prep.outputs.signed == 'true'
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: yes "" | bubblewrap build --skipPwaValidation

      - name: Build (unsigned toolchain check)
        if: steps.prep.outputs.signed != 'true'
        working-directory: android
        run: yes "" | bubblewrap build --skipPwaValidation --skipSigning

      - name: Show what was built
        working-directory: android
        run: |
          ls -la *.aab *.apk 2>/dev/null || true
          find . -name "*.aab" -o -name "*.apk" | head -20
          {
            echo "### KinWillow Android build"
            echo ""
            echo "- Version: $(jq -r .appVersion twa-manifest.json) (code $(jq -r .appVersionCode twa-manifest.json))"
            echo "- Signed: ${{ steps.prep.outputs.signed }}"
            if [ -f upload.p12 ]; then
              echo "- Upload key SHA-256: \`$(keytool -list -v -keystore upload.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing key from the workspace
        if: always()
        run: rm -f android/upload.p12

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: kinwillow-android
          path: |
            android/*.aab
            android/*.apk
            android/app/build/outputs/**/*.aab
            android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 30
